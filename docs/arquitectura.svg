<text x="42" y="170" font-size="14">8 cantos</text>
<rect x="30" y="190" width="210" height="60" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="42" y="216" font-size="16" font-weight="bold">Wikipedia</text>
<text x="42" y="240" font-size="14">53 artículos</text>
<rect x="30" y="280" width="210" height="80" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="42" y="306" font-size="16" font-weight="bold">Listas de nombres</text>
<text x="42" y="330" font-size="14">equivalencias.csv</text>
<text x="42" y="349" font-size="14">entidades.csv</text>
<rect x="300" y="50" width="220" height="130" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="312" y="76" font-size="16" font-weight="bold">Preparar los textos</text>
<text x="312" y="100" font-size="14">Se limpia la ortografía</text>
<text x="312" y="119" font-size="14">de los cantos y se parten</text>
<text x="312" y="138" font-size="14">en fragmentos</text>
<rect x="300" y="210" width="220" height="150" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="312" y="236" font-size="16" font-weight="bold">Construir el grafo</text>
<text x="312" y="260" font-size="14">Gemini saca personajes</text>
<text x="312" y="279" font-size="14">y relaciones de cada</text>
<text x="312" y="298" font-size="14">fragmento</text>
<rect x="580" y="50" width="250" height="310" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="592" y="76" font-size="16" font-weight="bold">Neo4j</text>
<rect x="600" y="90" width="210" height="110" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="612" y="116" font-size="16" font-weight="bold">Grafo</text>
<text x="612" y="140" font-size="14">Personajes, dioses, lugares</text>
<text x="612" y="159" font-size="14">y sus relaciones</text>
<rect x="600" y="215" width="210" height="130" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="612" y="241" font-size="16" font-weight="bold">Fragmentos</text>
<text x="612" y="265" font-size="14">El texto de los cantos y</text>
<text x="612" y="284" font-size="14">de Wikipedia con sus</text>
<text x="612" y="303" font-size="14">embeddings</text>
<rect x="890" y="50" width="200" height="120" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="902" y="76" font-size="16" font-weight="bold">RAG normal</text>
<text x="902" y="100" font-size="14">Busca los 5 fragmentos</text>
<text x="902" y="119" font-size="14">más parecidos a la</text>
<text x="902" y="138" font-size="14">pregunta</text>
<rect x="890" y="200" width="200" height="160" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="902" y="226" font-size="16" font-weight="bold">GraphRAG</text>
<text x="902" y="250" font-size="14">Busca los personajes de</text>
<text x="902" y="269" font-size="14">la pregunta en el grafo</text>
<text x="902" y="288" font-size="14">y trae sus relaciones</text>
<text x="902" y="307" font-size="14">y fragmentos</text>
<rect x="1150" y="80" width="200" height="150" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="1162" y="106" font-size="16" font-weight="bold">Agente (LangGraph)</text>
<text x="1162" y="130" font-size="14">Decide si usa RAG o</text>
<text x="1162" y="149" font-size="14">GraphRAG y responde</text>
<text x="1162" y="168" font-size="14">con citas</text>
<rect x="1150" y="260" width="200" height="90" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="1162" y="286" font-size="16" font-weight="bold">Interfaz (Gradio)</text>
<text x="1162" y="310" font-size="14">Chat para hacer</text>
<text x="1162" y="329" font-size="14">las preguntas</text>
<rect x="30" y="420" width="490" height="110" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="42" y="446" font-size="16" font-weight="bold">Modelos desde cero</text>
<text x="42" y="470" font-size="14">N-grama y mini red entrenados con el texto</text>
<text x="42" y="489" font-size="14">de los poemas. Se comparan con la perplejidad.</text>
<rect x="580" y="420" width="510" height="110" fill="#f4f4f4" stroke="#222" stroke-width="1.5"/>
<text x="592" y="446" font-size="16" font-weight="bold">Evaluación</text>
<text x="592" y="470" font-size="14">20 preguntas para comparar RAG y GraphRAG</text>
<text x="592" y="489" font-size="14">con el puntaje de un juez y el recall.</text>
